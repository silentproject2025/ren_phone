name: Build Firmware Binaries

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Update Board Manager and Install Core & Libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

          arduino-cli lib install "LovyanGFX"
          arduino-cli lib install "JPEGDEC"
          arduino-cli lib install "lvgl"
          # Coba install dari Library Manager, kalau gagal fallback ke git
          arduino-cli lib install "ESP32-audioI2S-master@3.4.6" || \
            arduino-cli lib install --git-url https://github.com/schreibfaul1/ESP32-audioI2S.git

          arduino-cli lib install "EspUsbHost" || \
            arduino-cli lib install --git-url https://github.com/tanakamasayuki/EspUsbHost.git

      - name: Compile Sketch
        run: |
          mkdir -p build_sketch
          cp phone.ino build_sketch/
          cp MjpegClass.h build_sketch/
          mv build_sketch/phone.ino build_sketch/build_sketch.ino

          # --- v86: app NES (core Nofrendo) ---
          # 4 file adapter ini WAJIB di root sketch (bukan src/) supaya
          # ikut digabung Arduino sbg satu translation unit sama build_sketch.ino
          # (butuh akses langsung ke class LGFX / objek `display` / SCR_W / SCR_H).
          cp nes_video_renphone.ino  build_sketch/
          cp nes_osd_renphone.ino    build_sketch/
          cp nes_input_renphone.ino  build_sketch/
          cp nes_app_renphone.ino    build_sketch/

          # Core Nofrendo (nes/, cpu/, mappers/, sndhrdw/, nofrendo.c, dll --
          # TANPA main.c/display.c/keyboard.c/osd.c/timing.c/sound.c/stubs.c,
          # itu semua sudah digantikan 4 file di atas). Diflatten jadi satu
          # folder src/ tanpa subfolder, biar gak perlu mikirin include path
          # rekursif punya arduino-cli.
          mkdir -p build_sketch/src
          find nofrendo_core \( -name "*.c" -o -name "*.h" \) \
            ! -name "main.c" ! -name "display.c" ! -name "keyboard.c" \
            ! -name "osd.c" ! -name "timing.c" ! -name "sound.c" \
            ! -name "stubs.c" \
            -exec cp {} build_sketch/src/ \;

          # v86: patch 1-baris di nofrendo.c biar main_loop() bisa berhenti
          # bersih pas nesExit() minta keluar (bukan cuma restart game terus).
          # Dilakukan otomatis di sini (bukan manual) supaya tetap konsisten
          # tiap kali source nofrendo di-refresh/re-vendor dari upstream.
          sed -i \
            's/while (false == console\.quit)/extern volatile bool nesExitRequested;\n while (false == console.quit \&\& !nesExitRequested)/' \
            build_sketch/src/nofrendo.c

          # Sanity check: pastikan patch beneran kena (biar CI gagal jelas
          # kalau upstream nofrendo.c berubah formatnya, bukan diam2 gagal).
          grep -q "nesExitRequested" build_sketch/src/nofrendo.c || \
            (echo "::error::Patch nesExitRequested gagal diterapkan ke nofrendo.c -- cek format while-loop di main_loop()" && exit 1)

          arduino-cli compile --fqbn esp32:esp32:esp32s3 \
            --board-options "FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" \
            --build-property "compiler.cpp.extra_flags=-DCONFIG_MBEDTLS_DYNAMIC_BUFFER=1 -DCONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=1 -DCONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096 -DCONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048" \
            build_sketch --output-dir build

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-binaries
          path: build/*.bin