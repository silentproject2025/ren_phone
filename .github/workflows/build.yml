name: Build Firmware Binaries

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ESP32-S3 Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure Board Manager & Install ESP32 Core
        run: |
          arduino-cli config init --overwrite
          # Perbaikan: URL Resmi Espressif
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Required Libraries
        run: |
          arduino-cli lib install "LovyanGFX"
          arduino-cli lib install "JPEGDEC"
          arduino-cli lib install "ESP32-audioI2S@3.4.6"
          arduino-cli lib install "EspUsbHost"

      - name: Prepare Sketch Structure
        run: |
          # Arduino CLI mengharuskan nama folder sama dengan nama file .ino
          mkdir -p phone
          cp phone.ino phone/
          if [ -f MjpegClass.h ]; then
            cp MjpegClass.h phone/
          fi

      - name: Compile Firmware
        run: |
          # Opsi board langsung disatukan ke FQBN
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB \
            --build-property "compiler.cpp.extra_flags=-DCONFIG_MBEDTLS_DYNAMIC_BUFFER=1 -DCONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=1 -DCONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096 -DCONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048" \
            --output-dir build \
            phone

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-binaries
          path: build/*.bin
          