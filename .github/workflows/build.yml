name: Build Firmware Binaries

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Update Board Manager and Install Core & Libraries
        run: |
          arduino-cli config init --overwrite
          # PERBAIKAN: URL di bawah ini sudah diperbaiki menjadi link JSON resmi Espressif
          arduino-cli config set board_manager.additional_urls https://githubusercontent.com
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "LovyanGFX"
          arduino-cli lib install "JPEGDEC"
          arduino-cli lib install "ESP32-audioI2S-master@3.4.6"
          arduino-cli lib install "EspUsbHost"

      - name: Compile Sketch
        run: |
          mkdir -p build_sketch
          cp phone.ino build_sketch/
          cp MjpegClass.h build_sketch/
          mv build_sketch/phone.ino build_sketch/build_sketch.ino
          
          # Tetap menggunakan optimasi Hybrid untuk Mbed TLS agar hemat DRAM tanpa matikan hardware crypto
          arduino-cli compile --fqbn esp32:esp32:esp32s3 \
            --board-options "FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" \
            --build-property "compiler.cpp.extra_flags=-DCONFIG_MBEDTLS_DYNAMIC_BUFFER=1 -DCONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=1 -DCONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096 -DCONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048" \
            build_sketch --output-dir build

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-binaries
          path: build/*.bin