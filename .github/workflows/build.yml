name: Build Firmware Binaries

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Update Board Manager and Install Core & Libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "LovyanGFX"
          arduino-cli lib install "lvgl@8.3.11"

      - name: Compile Sketch
        run: |
          mkdir -p build_sketch
          cp test.ino build_sketch/
          cp lv_conf.h build_sketch/
          cp build_opt.h build_sketch/
          mv build_sketch/test.ino build_sketch/build_sketch.ino
          arduino-cli compile --fqbn esp32:esp32:esp32s3 build_sketch --output-dir build

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-binaries
          path: build/*.bin
