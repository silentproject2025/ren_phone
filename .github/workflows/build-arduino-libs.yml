name: Build Arduino Libs (mbedTLS di PSRAM)

# Dijalankan MANUAL (Actions -> pilih workflow ini -> Run workflow).
# Membangun ulang library ESP-IDF milik core Arduino-ESP32 (target esp32s3)
# dgn CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y, lalu menyimpannya di GitHub Release
# bertag "arduino-libs-custom" (prerelease, supaya TIDAK jadi "latest" yg
# dibaca fitur Update OTA). build-firmware.yml otomatis memakainya.
# Proses ini LAMA (bisa berjam-jam) -- cukup dijalankan sekali per versi core.

on:
  workflow_dispatch:
    inputs:
      lib_builder_branch:
        description: "Branch esp32-arduino-lib-builder (samakan dgn IDF core, mis. release/v5.5)"
        default: "auto"
        required: true
      wifi_lwip_psram:
        description: "Taruh buffer WiFi/lwIP di PSRAM (hemat RAM internal, throughput WiFi bisa sedikit turun)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  libs:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Bebaskan ruang disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Setup Arduino CLI + catat versi core
        uses: arduino/setup-arduino-cli@v2

      - name: Pasang core esp32 (hanya utk mencatat versi)
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          CORE_VER=$(arduino-cli core list | awk '$1=="esp32:esp32"{print $2}')
          test -n "$CORE_VER" || (echo "::error::versi core tidak terbaca" && exit 1)
          echo "$CORE_VER" > "$RUNNER_TEMP/core-version.txt"
          echo "Versi core: $CORE_VER"
          ls "$HOME/.arduino15/packages/esp32/tools/esp32-arduino-libs" || true

      - name: Dependensi lib-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget curl libssl-dev libncurses-dev flex bison gperf \
            python3 python3-pip python3-venv python3-setuptools cmake ninja-build ccache jq p7zip-full
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"

      - name: Clone lib-builder
        run: |
          CORE_VER=$(cat "$RUNNER_TEMP/core-version.txt")
          BRANCH="${{ inputs.lib_builder_branch }}"
          [ "$BRANCH" = "auto" ] && BRANCH="master"
          echo "Branch: $BRANCH"
          git ls-remote --exit-code --heads https://github.com/espressif/esp32-arduino-lib-builder "$BRANCH" \
            || (echo "::error::branch $BRANCH tidak ada" && git ls-remote --heads https://github.com/espressif/esp32-arduino-lib-builder | grep release; exit 1)
          git clone --depth 1 --branch "$BRANCH" https://github.com/espressif/esp32-arduino-lib-builder "$HOME/lib-builder"

      - name: Tambah opsi sdkconfig (mbedTLS ke PSRAM)
        run: |
          cd "$HOME/lib-builder"
          ls
          F=$(find . -maxdepth 3 -name 'defconfig.esp32s3' -not -path './esp-idf/*' | head -n1)
          if [ -z "$F" ]; then
            echo "::error::defconfig.esp32s3 tidak ketemu"
            find . -maxdepth 3 -iname '*defconfig*' -not -path './esp-idf/*'
            exit 1
          fi
          echo "File: $F"
          # Opsi WAJIB (build digagalkan kalau tidak masuk ke sdkconfig hasil build)
          printf '\nCONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y\n' >> "$F"
          # Opsi tambahan (hanya diperingatkan kalau gagal masuk; lihat langkah "Cek hasil"):
          #  - DYNAMIC_BUFFER + DYNAMIC_FREE_CONFIG_DATA: buffer TLS dialokasi per-koneksi dan
          #    data konfigurasi dibuang setelah handshake. Ini pengganti -DCONFIG_MBEDTLS_* di
          #    build-firmware.yml yg TIDAK berefek (libmbedtls.a sudah jadi, flag -D cuma
          #    memengaruhi kode sketch).
          #  - ASYMMETRIC_CONTENT_LEN sengaja TIDAK diaktifkan: server yg tidak mendukung
          #    max-fragment-length bisa mengirim record 16 KB -> handshake gagal. Buffer
          #    sudah di PSRAM, jadi tidak perlu dikecilkan.
          #  - FREERTOS_TASK_CREATE_ALLOW_EXT_MEM: wajib utk xTaskCreateStaticPinnedToCore()
          #    dgn stack di PSRAM (dipakai createTaskPsramStack, DOOM, NES, Musik, Telepon).
          #  - SPIRAM_TRY_ALLOCATE_WIFI_LWIP: buffer WiFi/lwIP diutamakan di PSRAM (RAM
          #    internal lebih lega). Bisa dimatikan lewat input wifi_lwip_psram=false.
          {
            echo 'CONFIG_MBEDTLS_DYNAMIC_BUFFER=y'
            echo 'CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA=y'
            echo 'CONFIG_FREERTOS_TASK_CREATE_ALLOW_EXT_MEM=y'
            if [ "${{ inputs.wifi_lwip_psram }}" = "true" ]; then
              echo 'CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y'
            fi
          } >> "$F"
          tail -n 10 "$F"

      - name: Pra-clone arduino-esp32 + debug skrip
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          cd "$HOME/lib-builder"
          CORE_VER=$(cat "$RUNNER_TEMP/core-version.txt")
          AR_BRANCH="release/v${CORE_VER%.*}.x"
          echo "Arduino branch: $AR_BRANCH"
          git ls-remote --exit-code --heads https://github.com/espressif/arduino-esp32.git "$AR_BRANCH"
          git clone -b "$AR_BRANCH" https://github.com/espressif/arduino-esp32.git components/arduino
          git -C components/arduino log -1 --oneline
          echo "=== baris skrip yang menyebut URL/token ==="
          grep -rnE "AR_REPO|AR_SOURCE|arduino-esp32|GITHUB_TOKEN|git clone" tools/*.sh build.sh || true

      - name: Build library esp32s3 (LAMA)
        env:
          AR_REPO_URL: https://github.com/espressif/arduino-esp32.git
          IDF_REPO_URL: https://github.com/espressif/esp-idf.git
          GIT_TERMINAL_PROMPT: "0"
        run: |
          cd "$HOME/lib-builder"
          CORE_VER=$(cat "$RUNNER_TEMP/core-version.txt")
          AR_BRANCH="release/v${CORE_VER%.*}.x"
          echo "Arduino branch: $AR_BRANCH"
          env -u GITHUB_REPOSITORY ./build.sh -t esp32s3 -A "$AR_BRANCH"

      - name: Cek hasil + paketkan
        run: |
          cd "$HOME/lib-builder"
          OUT=$(find "$PWD" -type d -path '*/esp32-arduino-libs/esp32s3' -not -path '*/include/*' | head -n1)
          test -n "$OUT" || (echo "::error::folder hasil esp32s3 tidak ketemu" && find "$PWD" -maxdepth 4 -type d | head -50 && exit 1)
          echo "Hasil: $OUT"
          grep -q '^CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y' "$OUT/sdkconfig" || (echo "::error::opsi tidak masuk ke sdkconfig hasil build" && exit 1)
          for OPT in CONFIG_MBEDTLS_DYNAMIC_BUFFER CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA CONFIG_FREERTOS_TASK_CREATE_ALLOW_EXT_MEM CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP; do
            if grep -q "^$OPT=y" "$OUT/sdkconfig"; then echo "OK   $OPT=y"; else echo "::warning::$OPT tidak aktif di sdkconfig hasil build (dependensi Kconfig tidak terpenuhi atau dimatikan lewat input)"; fi
          done
          mkdir -p "$HOME/pkg"
          tar -czf "$HOME/pkg/esp32s3-libs.tar.gz" -C "$(dirname "$OUT")" esp32s3
          cp "$RUNNER_TEMP/core-version.txt" "$HOME/pkg/core-version.txt"
          ls -la "$HOME/pkg"

      - name: Upload ke GitHub Release (prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=arduino-libs-custom
          REPO=${{ github.repository }}
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$REPO" --prerelease --target "${{ github.sha }}" \
              --title "Library core kustom (mbedTLS di PSRAM)" \
              --notes "Dibangun oleh workflow Build Arduino Libs. Bukan firmware -- jangan dipakai utk OTA."
          gh release upload "$TAG" "$HOME/pkg/esp32s3-libs.tar.gz" "$HOME/pkg/core-version.txt" --repo "$REPO" --clobber
