name: nyxapp-tests
on:
  push:
    paths: ['firmware/phone/nyx*', 'tests/nyxapp/**', 'examples/native/**', 'apply_nyxapp_patch.py']
  pull_request:
    paths: ['firmware/phone/nyx*', 'tests/nyxapp/**', 'examples/native/**', 'apply_nyxapp_patch.py']
jobs:
  pc-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tes PC (arena, host native, app contoh, cek-sintaks glue)
        run: ./tests/nyxapp/run.sh
      - name: Cek anchor patch phone.ino masih cocok
        run: |
          if grep -q NYXAPP_V1 firmware/phone/phone.ino; then echo "sudah terpasang"; else python3 apply_nyxapp_patch.py --check; fi
