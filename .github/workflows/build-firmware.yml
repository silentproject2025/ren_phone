name: Build Firmware Binaries

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      use_custom_libs:
        description: "Pasang library kustom (mbedTLS di PSRAM)? false = pakai bawaan (untuk tes A/B)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Update Board Manager and Install Core & Libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

          arduino-cli lib install "LovyanGFX"
          arduino-cli lib install "JPEGDEC"
          arduino-cli lib install "lvgl"
          arduino-cli lib install "WebSockets"
          arduino-cli lib install "PubSubClient"
          arduino-cli lib install "ESP32-audioI2S-master@3.4.6" || \
            arduino-cli lib install --git-url https://github.com/schreibfaul1/ESP32-audioI2S.git

      - name: Pasang library core kustom (mbedTLS di PSRAM) - opsional
        if: ${{ inputs.use_custom_libs != false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Aman: kalau rilis belum ada / versi core beda / unduhan gagal -> lewati
          # dan pakai library bawaan core (build tetap jalan seperti biasa).
          TAG=arduino-libs-custom
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Rilis $TAG belum ada -> pakai library core bawaan"; exit 0
          fi
          mkdir -p /tmp/customlibs && cd /tmp/customlibs
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p 'esp32s3-libs.tar.gz' -p 'core-version.txt' --clobber; then
            echo "::warning::Gagal mengunduh library kustom -> pakai bawaan"; exit 0
          fi
          CORE_NOW=$(arduino-cli core list | awk '$1=="esp32:esp32"{print $2}')
          CORE_LIBS=$(cat core-version.txt)
          if [ "$CORE_NOW" != "$CORE_LIBS" ]; then
            echo "::warning::Versi core ($CORE_NOW) beda dgn library kustom ($CORE_LIBS) -> TIDAK dipasang. Jalankan ulang workflow Build Arduino Libs."; exit 0
          fi
          tar -xzf esp32s3-libs.tar.gz
          if ! grep -q '^CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y' esp32s3/sdkconfig; then
            echo "::warning::Paket kustom tidak berisi opsi yg diharapkan -> dilewati"; exit 0
          fi
          DEST=$(find "$HOME/.arduino15/packages/esp32/tools/esp32s3-libs" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -n1)
          if [ -z "$DEST" ] || [ ! -f "$DEST/sdkconfig" ]; then
            echo "::warning::folder esp32s3-libs tidak sesuai -> dilewati (DEST=$DEST)"
            ls "$HOME/.arduino15/packages/esp32/tools" | grep -i libs
            [ -n "$DEST" ] && ls "$DEST"
            exit 0
          fi
          echo "Target: $DEST"
          cp -a "$DEST" /tmp/esp32s3-libs.orig
          cp -a /tmp/customlibs/esp32s3/. "$DEST"/
          echo "::notice::Library kustom (mbedTLS di PSRAM) terpasang utk core $CORE_NOW"

      - name: Tentukan nama branch & cek kompatibilitas base
        env:
          RAW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          RP_BRANCH="$(printf '%s' "$RAW_BRANCH" | tr -c 'A-Za-z0-9_-' '-')"
          MY_BASE="$(grep -E '^#define RP_BASE_REV[[:space:]]+[0-9]+' ota_check_renphone.ino | grep -oE '[0-9]+' | head -1)"
          echo "Branch=$RP_BRANCH  RP_BASE_REV=${MY_BASE:-?}"
          if [ -z "$MY_BASE" ]; then
            echo "::error::RP_BASE_REV tidak ditemukan di ota_check_renphone.ino"; exit 1
          fi
          if [ "$RP_BRANCH" != "remote-control" ]; then
            if git fetch --depth=1 origin remote-control 2>/dev/null; then
              REF_BASE="$(git show FETCH_HEAD:ota_check_renphone.ino 2>/dev/null | grep -E '^#define RP_BASE_REV[[:space:]]+[0-9]+' | grep -oE '[0-9]+' | head -1)"
              if [ -n "$REF_BASE" ] && [ "$REF_BASE" != "$MY_BASE" ]; then
                echo "::error::Basis kode branch '$RP_BRANCH' (RP_BASE_REV=$MY_BASE) BEDA dgn remote-control ($REF_BASE). Firmware-nya tidak boleh dipertukarkan -> build dibatalkan. Samakan RP_BASE_REV."
                exit 1
              fi
            fi
          fi
          echo "RP_BRANCH=$RP_BRANCH" >> "$GITHUB_ENV"
          echo "RP_BASE_REV=$MY_BASE" >> "$GITHUB_ENV"

      - name: Verifikasi library kustom terpasang
        run: |
          DEST=$(find "$HOME/.arduino15/packages/esp32/tools/esp32s3-libs" -mindepth 1 -maxdepth 1 -type d | head -n1)
          echo "Target: $DEST"
          echo "=== sdkconfig (harus EXTERNAL=y) ==="
          grep -nE "MBEDTLS_(EXTERNAL|INTERNAL)_MEM_ALLOC" "$DEST/sdkconfig" || true
          echo "=== sdkconfig.h ==="
          find "$DEST" -name sdkconfig.h | head -5 | while read f; do
            echo "$f"; grep -nE "MBEDTLS_(EXTERNAL|INTERNAL)_MEM_ALLOC" "$f" || true
          done
          echo "=== sha256 libmbedtls.a: terpasang (atas) vs asli (bawah) ==="
          (cd "$DEST" && find . -name libmbedtls.a | sort | xargs -r sha256sum)
          echo "---"
          if [ -d /tmp/esp32s3-libs.orig ]; then
            (cd /tmp/esp32s3-libs.orig && find . -name libmbedtls.a | sort | xargs -r sha256sum)
          else
            echo "(tidak ada salinan asli -> libs kustom TIDAK terpasang)"
          fi

      - name: Compile Sketch
        run: |
          mkdir -p build_sketch
          cp phone.ino build_sketch/
          cp MjpegClass.h build_sketch/
          cp phone_notif_center.ino build_sketch/
          cp ppu_engine_renphone.ino build_sketch/
          cp wakeword_renphone.ino build_sketch/
          cp musicbt_renphone.ino build_sketch/
          cp avi_renphone.ino build_sketch/
          cp features_renphone.ino build_sketch/
          cp gallery_renphone.ino build_sketch/
          cp owner_renphone.ino build_sketch/
          cp homeedit_renphone.ino build_sketch/
          cp about_renphone.ino build_sketch/
          cp remote_renphone.ino build_sketch/
          cp chat_renphone.ino build_sketch/
          cp call_renphone.ino build_sketch/
          cp gamepad_renphone.ino build_sketch/
          cp ina219_renphone.ino build_sketch/
          cp ota_check_renphone.ino build_sketch/
          cp rplink.h build_sketch/
          cp ryne_engine.h build_sketch/
          mv build_sketch/phone.ino build_sketch/build_sketch.ino
          python3 ci_hoist_types.py build_sketch/build_sketch.ino build_sketch/rp_types.h

          cp nes_video_renphone.ino  build_sketch/
          cp nes_osd_renphone.ino    build_sketch/
          cp nes_input_renphone.ino  build_sketch/
          cp nes_app_renphone.ino    build_sketch/
          cp nes_0_protos_renphone.ino build_sketch/

          # ---- App DOOM (lib ESP-DOOM, divendor di esp_doom_core/) ----
          cp doom_renphone.ino build_sketch/
          cp hw_conf.h         build_sketch/

          mkdir -p build_sketch/src
          find nofrendo_core \( -name "*.c" -o -name "*.h" \) \
            ! -name "main.c" ! -name "display.c" ! -name "keyboard.c" \
            ! -name "osd.c" ! -name "timing.c" ! -name "sound.c" \
            ! -name "stubs.c" \
            -exec cp {} build_sketch/src/ \;

          find esp_doom_core \( -name "*.c" -o -name "*.cpp" -o -name "*.h" \) \
            -exec cp {} build_sketch/src/ \;

          grep -q "DoomGlue_Begin" build_sketch/src/DoomGlue.cpp || \
            (echo "::error::esp_doom_core tidak lengkap -- DoomGlue.cpp tidak ketemu di build_sketch/src" && exit 1)

          sed -i \
            's/while (false == console\.quit)/extern volatile bool nesExitRequested;\n while (false == console.quit \&\& !nesExitRequested)/' \
            build_sketch/src/nofrendo.c

          grep -q "nesExitRequested" build_sketch/src/nofrendo.c || \
            (echo "::error::Patch nesExitRequested gagal diterapkan ke nofrendo.c" && exit 1)

          sed -i '/^void vid_setpalette/,/^}/d' build_sketch/src/vid_drv.c

          grep -q "vid_setpalette" build_sketch/src/vid_drv.c && \
            (echo "::error::Patch penghapusan vid_setpalette gagal diterapkan ke vid_drv.c" && exit 1)

          grep -rl '\blog_printf\b' build_sketch/src | xargs -r sed -i 's/\blog_printf\b/nof_log_printf/g'

          grep -rq '\blog_printf\b' build_sketch/src/log.c && \
            (echo "::error::Patch rename log_printf gagal diterapkan" && exit 1)

          NOF_INCLUDE="$(pwd)/build_sketch/src"

          arduino-cli compile --fqbn esp32:esp32:esp32s3 \
            --board-options "FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" \
            --build-property "compiler.cpp.extra_flags=-DRP_BUILD_NUM=${{ github.run_number }} -DRP_BRANCH=${RP_BRANCH} -DCONFIG_MBEDTLS_DYNAMIC_BUFFER=1 -DCONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=1 -DCONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096 -DCONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048 -I${NOF_INCLUDE}" \
            --build-property "compiler.c.extra_flags=-I${NOF_INCLUDE}" \
            build_sketch --output-dir build

      - name: Diagnostik prototipe (hanya jalan kalau compile gagal)
        if: failure()
        run: |
          mkdir -p diag
          NOF_INCLUDE="$(pwd)/build_sketch/src"
          arduino-cli version > diag/versions.txt 2>&1 || true
          arduino-cli core list >> diag/versions.txt 2>&1 || true
          arduino-cli lib list >> diag/versions.txt 2>&1 || true
          arduino-cli compile --fqbn esp32:esp32:esp32s3 \
            --board-options "FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" \
            --build-property "compiler.cpp.extra_flags=-I${NOF_INCLUDE}" \
            --build-property "compiler.c.extra_flags=-I${NOF_INCLUDE}" \
            --preprocess build_sketch > diag/preprocessed.cpp 2> diag/preprocess.err || true
          head -c 300000 diag/preprocessed.cpp > diag/preprocessed_head.cpp || true
          rm -f diag/preprocessed.cpp
          cp build_sketch/rp_types.h diag/ 2>/dev/null || true

      - name: Upload diagnostik
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostik-prototipe
          path: diag/

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-binaries
          path: build/*.bin

      - name: Siapkan firmware.bin untuk OTA
        if: github.event_name != 'pull_request'
        run: |
          test -f build/build_sketch.ino.bin || (echo "::error::build_sketch.ino.bin tidak ada" && ls build && exit 1)
          cp build/build_sketch.ino.bin firmware.bin
          test -f build/build_sketch.ino.merged.bin || (echo "::error::build_sketch.ino.merged.bin tidak ada" && ls build && exit 1)
          cp build/build_sketch.ino.merged.bin ren_phone_s3_merged.bin
          MD5="$(md5sum firmware.bin | cut -d' ' -f1)"
          SIZE="$(stat -c%s firmware.bin)"
          {
            echo "branch=${RP_BRANCH}"
            echo "build=${{ github.run_number }}"
            echo "base=${RP_BASE_REV}"
            echo "size=${SIZE}"
            echo "md5=${MD5}"
            echo "sha=${{ github.sha }}"
          } > info.txt
          cat info.txt

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          # branch stabil = rilis biasa; branch lain = PRERELEASE (tidak dianggap "terbaru" oleh tombol versi lama)
          case "$RP_BRANCH" in main|master|remote-control) PRE="" ;; *) PRE="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" firmware.bin ren_phone_s3_merged.bin --clobber
          else
            gh release create "$TAG" firmware.bin ren_phone_s3_merged.bin $PRE \
              --target "${{ github.sha }}" \
              --title "Firmware build ${{ github.run_number }}" \
              --notes "Commit ${{ github.sha }} (${{ github.ref_name }})"
          fi

          # channel bergerak per-branch -- dibaca fitur "pilih branch" di app Update (selalu prerelease)
          CH="channel-${RP_BRANCH}"
          NOTES="Channel branch ${RP_BRANCH}: build ${{ github.run_number }}, commit ${{ github.sha }}"
          if gh release view "$CH" >/dev/null 2>&1; then
            gh release upload "$CH" firmware.bin info.txt --clobber
            gh release edit "$CH" --prerelease --notes "$NOTES"
          else
            gh release create "$CH" firmware.bin info.txt --prerelease \
              --target "${{ github.sha }}" \
              --title "Channel ${RP_BRANCH}" \
              --notes "$NOTES"
          fi

  flasher:
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/flasher-pages.yml
