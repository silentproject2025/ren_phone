name: Build Firmware Binaries

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      use_custom_libs:
        description: "Pasang library kustom (mbedTLS di PSRAM)? false = pakai bawaan (untuk tes A/B)"
        type: boolean
        default: true
      loop_core:
        description: "Core tempat loop()/UI berjalan (untuk tes A/B performa game). default = bawaan core Arduino"
        type: choice
        options: [ "default", "0", "1" ]
        default: "default"
      simd_pie:
        description: "SIMD PIE (instruksi vektor ESP32-S3) utk evaluasi NN catur. on = bawaan (dipakai bila NN aktif); off = jalur skalar (tes A/B)"
        type: choice
        options: [ "on", "off" ]
        default: "on"
      chess_opt:
        description: "NYX-MAX: tingkat optimasi mesin catur. O3 = bawaan (tercepat, kode lebih besar); O2 = lebih kecil (tes A/B / bila partisi app penuh)"
        type: choice
        options: [ "O3", "O2" ]
        default: "O3"
      push_diff:
        description: "RP_PUSH_DIFF (varian st7796 & aether): kirim hanya baris layar yg berubah -> sentuh/animasi lebih responsif. default = bawaan profil (1 = aktif; kalau layar korup/ada sisa gambar -> pilih 0); 1 = paksa aktif; 0 = paksa mati. Varian ili9341 diabaikan"
        type: choice
        options: [ "default", "0", "1" ]
        default: "default"
      nyx_nn:
        description: "Level Nyx memakai evaluasi jaringan saraf (NN, -DCHS_NN_NYX=1)? EKSPERIMEN; hanya dengan ini SIMD PIE terpakai. Core ke-2 (Lazy SMP) otomatis tidak dipakai saat NN aktif"
        type: choice
        options: [ "off", "on" ]
        default: "off"

permissions:
  contents: write

jobs:
  build:
    # Dua varian dari kode yang SAMA, masing-masing job & rilis terpisah:
    #   ili9341 = layar lama 320x240 + XPT2046 (perilaku/nama rilis TIDAK berubah)
    #   st7796  = layar 3,5" ST7796 480x320 + FT6236 (-DRP_DISPLAY_ST7796)
    #   aether  = Aether Board: ST7796 + FT6336U + SD lewat SPI berbagi bus (-DRP_BOARD_AETHER)
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [ ili9341, st7796, aether ]
    env:
      VARIANT: ${{ matrix.variant }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # Cache 1: arsip unduhan core/toolchain saja (~/.arduino15/staging), BUKAN folder
      # packages. Folder packages dihindari karena library kustom ditimpa ke sana; kalau
      # ikut di-cache, tes A/B (use_custom_libs=false) akan memakai library kustom.
      - name: Kunci cache unduhan (per bulan)
        id: dlkey
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache unduhan Arduino (core & toolchain)
        uses: actions/cache@v4
        with:
          path: ~/.arduino15/staging
          key: arduino-dl-v2-${{ runner.os }}-${{ steps.dlkey.outputs.month }}

      - name: Update Board Manager and Install Core & Libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli core update-index
          # CI_RETRY_V1: unduhan toolchain kadang putus -> ulangi
          # LIBS_SRCVER_V1: core dipasang dgn versi yg SAMA dgn library kustom (core-version.txt di rilis
          # arduino-libs-custom), supaya header library cocok dgn source core. Hanya seri 3.x yang diterima
          # (core 4.x merusak build). Cadangan: 3.3.6.
          CORE_PIN=3.3.6
          if [ "${{ inputs.use_custom_libs }}" != "false" ] && \
             gh release download arduino-libs-custom --repo "$GITHUB_REPOSITORY" -p core-version.txt --dir /tmp/cv --clobber >/dev/null 2>&1; then
            V=$(tr -d ' \r\n' < /tmp/cv/core-version.txt)
            case "$V" in
              3.[0-9]*.[0-9]*) CORE_PIN="$V"; echo "Core dipin ke $V (sama dgn library kustom)";;
              *) echo "::warning::core-version.txt tidak valid ($V) -> pakai $CORE_PIN";;
            esac
          fi
          ok=0
          for try in 1 2 3 4; do
            arduino-cli core install "esp32:esp32@${CORE_PIN}" && ok=1 && break
            echo "Unduhan core gagal (percobaan $try), ulangi 20 dtk lagi..."; sleep 20
          done
          if [ "$ok" != 1 ] && [ "$CORE_PIN" != 3.3.6 ]; then
            echo "::warning::core $CORE_PIN tidak bisa dipasang -> pakai 3.3.6 (library kustom akan dilewati)"
            arduino-cli core install esp32:esp32@3.3.6 || exit 1
          elif [ "$ok" != 1 ]; then
            exit 1
          fi

          arduino-cli lib install "LovyanGFX"
          arduino-cli lib install "JPEGDEC"
          arduino-cli lib install "lvgl"
          arduino-cli lib install "WebSockets"
          arduino-cli lib install "PubSubClient"
          arduino-cli lib install "ESP32-audioI2S-master@3.4.6" || \
            arduino-cli lib install --git-url https://github.com/schreibfaul1/ESP32-audioI2S.git
          arduino-cli lib install "arduino-libhelix" || \
            arduino-cli lib install --git-url https://github.com/pschatzmann/arduino-libhelix.git   # decoder MP3 utk pemutar speaker (musspk.h)

      - name: Pasang library core kustom (mbedTLS di PSRAM) - opsional
        if: ${{ inputs.use_custom_libs != false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Aman: kalau rilis belum ada / versi core beda / unduhan gagal -> lewati
          # dan pakai library bawaan core (build tetap jalan seperti biasa).
          TAG=arduino-libs-custom
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Rilis $TAG belum ada -> pakai library core bawaan"; exit 0
          fi
          mkdir -p /tmp/customlibs && cd /tmp/customlibs
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p 'esp32s3-libs.tar.gz' -p 'core-version.txt' --clobber; then
            echo "::warning::Gagal mengunduh library kustom -> pakai bawaan"; exit 0
          fi
          CORE_NOW=$(arduino-cli core list | awk '$1=="esp32:esp32"{print $2}')
          CORE_LIBS=$(cat core-version.txt)
          if [ "$CORE_NOW" != "$CORE_LIBS" ]; then
            echo "::warning::Versi core ($CORE_NOW) beda dgn library kustom ($CORE_LIBS) -> TIDAK dipasang. Jalankan ulang workflow Build Arduino Libs."; exit 0
          fi
          tar -xzf esp32s3-libs.tar.gz
          if ! grep -q '^CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y' esp32s3/sdkconfig; then
            echo "::warning::Paket kustom tidak berisi opsi yg diharapkan -> dilewati"; exit 0
          fi
          DEST=$(find "$HOME/.arduino15/packages/esp32/tools/esp32s3-libs" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -n1)
          if [ -z "$DEST" ] || [ ! -f "$DEST/sdkconfig" ]; then
            echo "::warning::folder esp32s3-libs tidak sesuai -> dilewati (DEST=$DEST)"
            ls "$HOME/.arduino15/packages/esp32/tools" | grep -i libs
            [ -n "$DEST" ] && ls "$DEST"
            exit 0
          fi
          echo "Target: $DEST"
          cp -a "$DEST" /tmp/esp32s3-libs.orig
          cp -a /tmp/customlibs/esp32s3/. "$DEST"/
          echo "::notice::Library kustom (mbedTLS di PSRAM) terpasang utk core $CORE_NOW"

      # NYX-DIAG-LD: bandingkan kompiler pembuat arsip kustom vs arsip asli + linker yg dipakai.
      # Hanya mencetak info; tidak menggagalkan build.
      - name: Diagnostik toolchain library kustom (ld crash elf32-xtensa.c:952)
        if: ${{ inputs.use_custom_libs != false }}
        continue-on-error: true
        run: |
          RE=$(find "$HOME/.arduino15/packages/esp32/tools" -type f -name 'xtensa-esp-elf-readelf' | head -n1)
          LD=$(find "$HOME/.arduino15/packages/esp32/tools" -type f -name 'xtensa-esp-elf-ld' | head -n1)
          echo "readelf: $RE"; "$LD" --version | head -n1
          CUR=$(find "$HOME/.arduino15/packages/esp32/tools/esp32s3-libs" -mindepth 1 -maxdepth 1 -type d | head -n1)
          for D in /tmp/esp32s3-libs.orig "$CUR"; do
            [ -d "$D/lib" ] || continue
            echo "=== $D (kompiler pembuat objek, hitungan per versi) ==="
            for A in libfreertos.a libesp_system.a liblwip.a; do
              "$RE" -p .comment "$D/lib/$A" 2>/dev/null | grep -i 'GCC' | sort | uniq -c
            done
            echo "--- sisa section .debug di libfreertos.a (0 = sudah bersih) ---"
            "$RE" -S "$D/lib/libfreertos.a" 2>/dev/null | grep -c '\.debug' || true
          done

      # Cache 2: cache build arduino-cli (core.a dan objek library yg sudah dikompilasi).
      # Key memuat versi core, identitas paket library kustom, dan flag use_custom_libs,
      # sehingga core.a lama tidak pernah dipakai dgn sdkconfig.h yg berbeda.
      # restore-keys sengaja hanya mencocokkan awalan yg SAMA (core + libs sama).
      - name: Hitung kunci cache compile
        id: bckey
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CORE_NOW=$(arduino-cli core list | awk '$1=="esp32:esp32"{print $2}')
          LIBS_ID=none
          if [ "${{ inputs.use_custom_libs }}" != "false" ]; then
            LIBS_ID=$(gh release view arduino-libs-custom --repo "$GITHUB_REPOSITORY" \
              --json assets -q '.assets[] | select(.name=="esp32s3-libs.tar.gz") | "\(.size)-\(.updatedAt)"' 2>/dev/null | tr -c 'A-Za-z0-9._-' '_' || true)
            [ -n "$LIBS_ID" ] || LIBS_ID=none
          fi
          echo "prefix=arduino-build-v2-${{ runner.os }}-${{ matrix.variant }}-core${CORE_NOW}-libs${LIBS_ID}" >> "$GITHUB_OUTPUT"
          echo "Kunci cache compile: core=${CORE_NOW} libs=${LIBS_ID}"

      - name: Cache compile Arduino
        uses: actions/cache@v4
        with:
          path: ~/.cache/arduino
          key: ${{ steps.bckey.outputs.prefix }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.bckey.outputs.prefix }}-

      - name: Tentukan nama branch & cek kompatibilitas base
        env:
          RAW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          RP_BRANCH="$(printf '%s' "$RAW_BRANCH" | tr -c 'A-Za-z0-9_-' '-')"
          MY_BASE="$(grep -E '^#define RP_BASE_REV[[:space:]]+[0-9]+' firmware/phone/ota_check_renphone.ino | grep -oE '[0-9]+' | head -1)"
          echo "Branch=$RP_BRANCH  RP_BASE_REV=${MY_BASE:-?}"
          if [ -z "$MY_BASE" ]; then
            echo "::error::RP_BASE_REV tidak ditemukan di firmware/phone/ota_check_renphone.ino"; exit 1
          fi
          if [ "$RP_BRANCH" != "main" ]; then
            if git fetch --depth=1 origin main 2>/dev/null; then
              REF_BASE="$( { git show FETCH_HEAD:firmware/phone/ota_check_renphone.ino 2>/dev/null || git show FETCH_HEAD:ota_check_renphone.ino 2>/dev/null; } | grep -E '^#define RP_BASE_REV[[:space:]]+[0-9]+' | grep -oE '[0-9]+' | head -1)"
              if [ -n "$REF_BASE" ] && [ "$REF_BASE" != "$MY_BASE" ]; then
                echo "::error::Basis kode branch '$RP_BRANCH' (RP_BASE_REV=$MY_BASE) BEDA dgn main ($REF_BASE). Firmware-nya tidak boleh dipertukarkan -> build dibatalkan. Samakan RP_BASE_REV."
                exit 1
              fi
            fi
          fi
          # varian layar lain = channel OTA sendiri (HP ILI9341 tidak pernah menarik firmware ST7796)
          if [ "$VARIANT" = "st7796" ]; then RP_BRANCH="${RP_BRANCH}-st7796"; fi
          if [ "$VARIANT" = "aether" ]; then RP_BRANCH="${RP_BRANCH}-aether"; fi
          echo "RP_BRANCH=$RP_BRANCH" >> "$GITHUB_ENV"
          echo "RP_BASE_REV=$MY_BASE" >> "$GITHUB_ENV"

      - name: Verifikasi library kustom terpasang
        run: |
          DEST=$(find "$HOME/.arduino15/packages/esp32/tools/esp32s3-libs" -mindepth 1 -maxdepth 1 -type d | head -n1)
          echo "Target: $DEST"
          echo "=== sdkconfig (harus EXTERNAL=y) ==="
          grep -nE "MBEDTLS_(EXTERNAL|INTERNAL)_MEM_ALLOC|MBEDTLS_DYNAMIC_(BUFFER|FREE_CONFIG_DATA)|FREERTOS_TASK_CREATE_ALLOW_EXT_MEM|SPIRAM_TRY_ALLOCATE_WIFI_LWIP" "$DEST/sdkconfig" || true
          echo "=== sdkconfig.h ==="
          find "$DEST" -name sdkconfig.h | head -5 | while read f; do
            echo "$f"; grep -nE "MBEDTLS_(EXTERNAL|INTERNAL)_MEM_ALLOC" "$f" || true
          done
          echo "=== NYX-ELF: elf_loader terpasang? (esp_elf.h + libelf_loader.a) ==="
          if find "$DEST" -name esp_elf.h | grep -q . && find "$DEST" -name '*elf_loader*.a' | grep -q .; then
            echo "::notice::elf_loader ADA di library kustom -> NYXAPP_HAVE_ELF=1"
          else
            echo "::warning::elf_loader TIDAK ada di library terpasang -> Nyx Apps tanpa loader. Jalankan Build Arduino Libs dgn elf_loader=true"
          fi
          echo "=== sha256 libmbedtls.a: terpasang (atas) vs asli (bawah) ==="
          (cd "$DEST" && find . -name libmbedtls.a | sort | xargs -r sha256sum)
          echo "---"
          if [ -d /tmp/esp32s3-libs.orig ]; then
            (cd /tmp/esp32s3-libs.orig && find . -name libmbedtls.a | sort | xargs -r sha256sum)
          else
            echo "(tidak ada salinan asli -> libs kustom TIDAK terpasang)"
          fi

      - name: Compile Sketch
        env:
          LOOP_CORE_IN: ${{ inputs.loop_core }}
          SIMD_PIE_IN: ${{ inputs.simd_pie }}
          NYX_NN_IN: ${{ inputs.nyx_nn }}
          CHESS_OPT_IN: ${{ inputs.chess_opt }}
          PUSH_DIFF_IN: ${{ inputs.push_diff }}
        run: |
          set -o pipefail  # NYX-ERRSUM
          # Pencocokan di shell (persis), BUKAN ekspresi Actions: di ekspresi, '' == '0' bernilai
          # true (keduanya dikonversi jadi angka 0), sehingga build dari push ikut memakai opsi kosong.
          case "$LOOP_CORE_IN" in
            0|1) LOOP_OPT=",LoopCore=$LOOP_CORE_IN" ;;
            *)   LOOP_OPT="" ;;
          esac
          # NYX-SIMD-OPT-V1: opsi catur. Pencocokan persis di shell; input kosong (build dari push) = perilaku lama.
          CHS_FLAGS=""
          [ "$SIMD_PIE_IN" = "off" ] && CHS_FLAGS="$CHS_FLAGS -DCHS_NN_NO_PIE"
          [ "$NYX_NN_IN" = "on" ] && CHS_FLAGS="$CHS_FLAGS -DCHS_NN_NYX=1"
          [ "$CHESS_OPT_IN" = "O2" ] && CHS_FLAGS="$CHS_FLAGS -DCHS_OPT3=0"
          echo "Opsi catur: simd_pie=${SIMD_PIE_IN:-on} nyx_nn=${NYX_NN_IN:-off} chess_opt=${CHESS_OPT_IN:-O3} flag='${CHS_FLAGS}'"
          for f in firmware/phone/*.ino firmware/phone/*.h; do
            if grep -qaP '\x00' "$f"; then echo "::error::$f berisi byte NUL (file terpotong)"; exit 1; fi
          done
          mkdir -p build_sketch
          cp firmware/phone/phone.ino build_sketch/
          cp firmware/phone/MjpegClass.h build_sketch/
          cp firmware/phone/i18n.h build_sketch/        # I18N_V1: sistem 2 bahasa (English default + Indonesia)
          cp firmware/phone/i18n_dict.h build_sketch/
          cp firmware/phone/phone_notif_center.ino build_sketch/
          cp firmware/phone/ppu_engine_renphone.ino build_sketch/
          cp firmware/phone/wakeword_renphone.ino build_sketch/
          cp firmware/phone/power_renphone.ino build_sketch/
          cp firmware/phone/musicbt_renphone.ino build_sketch/
          cp firmware/phone/musspk.h build_sketch/              # pemutar MP3/WAV lokal -> MAX98357A
          cp firmware/phone/musfs.h build_sketch/               # SPK_FFAT_V1: worker FFat + musRamLog (di-include musspk.h)
          cp firmware/phone/avi_renphone.ino build_sketch/
          cp firmware/phone/features_renphone.ino build_sketch/
          cp firmware/phone/gallery_renphone.ino build_sketch/
          cp firmware/phone/owner_renphone.ino build_sketch/
          cp firmware/phone/homeedit_renphone.ino build_sketch/
          cp firmware/phone/about_renphone.ino build_sketch/
          cp firmware/phone/remote_renphone.ino build_sketch/
          cp firmware/phone/chat_renphone.ino build_sketch/
          cp firmware/phone/chess_renphone.ino build_sketch/
          mkdir -p build_sketch/src
          sed -n '/==== ENGINE BEGIN ====/,/==== ENGINE END ====/p;/==== AI BEGIN ====/,/==== AI END ====/p' firmware/phone/chess_renphone.ino > build_sketch/src/chess_engine.inc
          cp firmware/phone/extras/chess_smp.cpp build_sketch/src/
          cp firmware/phone/emoji_renphone.ino build_sketch/
          cp firmware/phone/emoji_data.h build_sketch/
          cp firmware/phone/kamus_renphone.ino build_sketch/
          cp firmware/phone/kamus_core.h build_sketch/
          cp firmware/phone/kamus_data.h build_sketch/
          cp firmware/phone/call_renphone.ino build_sketch/
          cp firmware/phone/nyxextras_renphone.ino build_sketch/
          cp firmware/phone/nyxhost.h build_sketch/
          cp firmware/phone/nyx_app.h build_sketch/
          cp firmware/phone/nyxmem.h build_sketch/
          cp firmware/phone/nyxapp_renphone.ino build_sketch/
          cp firmware/phone/nyxstore_core.h build_sketch/        # NYXSTORE_V1: Nyx Store
          cp firmware/phone/nyxstore_renphone.ino build_sketch/
          cp firmware/phone/sysmem.h build_sketch/            # SYSMEM_V1
          cp firmware/phone/sysmem_fw.h build_sketch/
          cp firmware/phone/sysmem_renphone.ino build_sketch/
          cp firmware/phone/gamepad_renphone.ino build_sketch/
          cp firmware/phone/ina219_renphone.ino build_sketch/
          cp firmware/phone/ota_check_renphone.ino build_sketch/
          cp firmware/phone/ptr_renphone.ino build_sketch/
          cp firmware/phone/rplink.h build_sketch/
          cp firmware/phone/cam_rx.h build_sketch/
          cp firmware/phone/cam_avi.h build_sketch/
          cp firmware/phone/ryne_engine.h build_sketch/
          mv build_sketch/phone.ino build_sketch/build_sketch.ino
          python3 tools/ci/ci_hoist_types.py build_sketch/build_sketch.ino build_sketch/rp_types.h

          cp firmware/phone/nes_video_renphone.ino  build_sketch/
          cp firmware/phone/nes_osd_renphone.ino    build_sketch/
          cp firmware/phone/nes_input_renphone.ino  build_sketch/
          cp firmware/phone/nes_app_renphone.ino    build_sketch/
          cp firmware/phone/nes_0_protos_renphone.ino build_sketch/

          # ---- App DOOM (lib ESP-DOOM, divendor di esp_doom_core/) ----
          cp firmware/phone/doom_renphone.ino build_sketch/
          cp firmware/phone/camera_renphone.ino build_sketch/
          cp firmware/phone/ebook_renphone.ino build_sketch/
          cp firmware/phone/ebook_core.h build_sketch/
          cp firmware/phone/gutenberg_renphone.ino build_sketch/
          cp firmware/phone/backup_renphone.ino build_sketch/
          cp firmware/phone/backup_core.h build_sketch/
          cp firmware/phone/backup_crypto.h build_sketch/
          cp firmware/phone/sec_core.h build_sketch/        # SEC_V1: hash sandi web, API key terenkripsi, kunci OTA
          cp firmware/phone/ota_pubkey.h build_sketch/      # OTA_SIG_V1: kunci publik tanda tangan OTA (kosong = mati)
          cp firmware/phone/backup_cloud.h build_sketch/
          cp firmware/phone/backup_sync_renphone.ino build_sketch/
          cp firmware/phone/gutendex_core.h build_sketch/
          cp firmware/phone/gutdl_core.h build_sketch/
          cp firmware/phone/heaplog_renphone.ino build_sketch/
          cp firmware/phone/hwscroll_renphone.ino build_sketch/
          cp firmware/phone/pager_renphone.ino build_sketch/
          cp firmware/phone/hw_conf.h         build_sketch/
          cp firmware/phone/display_conf.h    build_sketch/
          cp firmware/phone/devreg_conf.h     build_sketch/
          cp firmware/phone/devreg_renphone.ino build_sketch/
          cp firmware/phone/brokercfg_renphone.ino build_sketch/   # BROKERCFG_V1: kredensial broker Chat/Catur dari Supabase
          cp firmware/phone/wifisense_renphone.ino build_sketch/   # WSENSE_V1: WiFi Sensing (CSI)

          mkdir -p build_sketch/src
          find third_party/nofrendo_core \( -name "*.c" -o -name "*.h" \) \
            ! -name "main.c" ! -name "display.c" ! -name "keyboard.c" \
            ! -name "osd.c" ! -name "timing.c" ! -name "sound.c" \
            ! -name "stubs.c" \
            -exec cp {} build_sketch/src/ \;

          find third_party/esp_doom_core \( -name "*.c" -o -name "*.cpp" -o -name "*.h" \) \
            -exec cp {} build_sketch/src/ \;

          # Percepat inti emulator/DOOM: -O2 per-file lewat pragma (sisa sketch tetap -Os
          # supaya partisi app 3 MB tidak penuh). Hanya mengubah salinan di build_sketch/.
          for f in build_sketch/src/*.c build_sketch/src/*.cpp; do
            [ -f "$f" ] || continue
            grep -q 'GCC optimize' "$f" && continue
            sed -i '1i #pragma GCC optimize ("O2")' "$f"
          done

          grep -q "DoomGlue_Begin" build_sketch/src/DoomGlue.cpp || \
            (echo "::error::esp_doom_core tidak lengkap -- DoomGlue.cpp tidak ketemu di build_sketch/src" && exit 1)

          sed -i \
            's/while (false == console\.quit)/extern volatile bool nesExitRequested;\n while (false == console.quit \&\& !nesExitRequested)/' \
            build_sketch/src/nofrendo.c

          grep -q "nesExitRequested" build_sketch/src/nofrendo.c || \
            (echo "::error::Patch nesExitRequested gagal diterapkan ke nofrendo.c" && exit 1)

          sed -i '/^void vid_setpalette/,/^}/d' build_sketch/src/vid_drv.c

          grep -q "vid_setpalette" build_sketch/src/vid_drv.c && \
            (echo "::error::Patch penghapusan vid_setpalette gagal diterapkan ke vid_drv.c" && exit 1)

          grep -rl '\blog_printf\b' build_sketch/src | xargs -r sed -i 's/\blog_printf\b/nof_log_printf/g'

          grep -rq '\blog_printf\b' build_sketch/src/log.c && \
            (echo "::error::Patch rename log_printf gagal diterapkan" && exit 1)

          RP_VERSION=dev
          [ -f VERSION ] && RP_VERSION="$(tr -d ' \r\n' < VERSION)"
          [ -n "$RP_VERSION" ] || RP_VERSION=dev
          echo "$RP_VERSION" | grep -Eq '^(dev|[0-9]+(\.[0-9]+)*(-[A-Za-z0-9]+)?)$' || { echo "::error::isi file VERSION tidak valid: $RP_VERSION"; exit 1; }
          echo "Versi: $RP_VERSION"

          NOF_INCLUDE="$(pwd)/build_sketch/src"

          echo "Opsi board tambahan: '${LOOP_OPT}' (kosong = bawaan)"
          DISP_FLAG=""
          [ "$VARIANT" = "st7796" ] && DISP_FLAG="-DRP_DISPLAY_ST7796"
          [ "$VARIANT" = "aether" ] && DISP_FLAG="-DRP_BOARD_AETHER"
          PD_FLAG=""
          case "$PUSH_DIFF_IN" in
            0|1) if [ "$VARIANT" != "ili9341" ]; then PD_FLAG=" -DRP_PUSH_DIFF=$PUSH_DIFF_IN"; fi ;;
          esac
          echo "Varian layar: $VARIANT ${DISP_FLAG}${PD_FLAG} (push_diff input: '${PUSH_DIFF_IN:-default}')"
          arduino-cli compile --fqbn esp32:esp32:esp32s3 \
            --board-options "FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB${LOOP_OPT}" \
            --build-property "compiler.cpp.extra_flags=-DWSENSE_FORCE=1 -DRP_BUILD_NUM=${{ github.run_number }} -DRP_BRANCH=${RP_BRANCH} -DRP_VERSION=${RP_VERSION} ${DISP_FLAG}${PD_FLAG}${CHS_FLAGS} -I${NOF_INCLUDE}" \
            --build-property "compiler.c.extra_flags=-I${NOF_INCLUDE}" \
            build_sketch --output-dir build 2>&1 | tee compile.log

      - name: Ringkasan error (hanya jalan kalau compile gagal)
        if: failure()
        run: |
          [ -f compile.log ] || { echo "compile.log tidak ada (gagal sebelum compile)"; exit 0; }
          PAT='error:|Error:|dangerous relocation|undefined reference|overflowed|too big|cannot encode|multiple definition|No such file|ld returned|Sketch too big'
          N_ASSERT=$(grep -c "assertion fail" compile.log || true)
          {
            echo "## Ringkasan error compile (${VARIANT:-?})"
            echo
            echo "Baris 'assertion fail' (linker crash): **${N_ASSERT}** kali"
            grep -m1 "assertion fail" compile.log | cut -c1-300 | sed 's/^/    /' || true
            echo
            echo "### Error pertama (selain assertion)"
            echo '```'
            grep -v "assertion fail" compile.log | grep -v "^/builds/idf" | grep -n -iE "$PAT" | head -25 | cut -c1-300
            echo '```'
            echo "### 25 baris terakhir (selain assertion)"
            echo '```'
            grep -v "assertion fail" compile.log | grep -v "^/builds/idf" | tail -25 | cut -c1-300
            echo '```'
            # COMPILELOG_V1: konteks linker apa adanya (termasuk baris assertion/pesan ld yg disaring di atas)
            echo "### 40 baris sebelum collect2 (apa adanya)"
            echo '```'
            CL=$(grep -n "collect2: error" compile.log | head -1 | cut -d: -f1)
            if [ -n "$CL" ]; then S=$((CL>40 ? CL-40 : 1)); sed -n "${S},${CL}p" compile.log | cut -c1-300; else echo "(tidak ada baris collect2)"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # juga jadi Annotations (mudah dibaca di app GitHub HP)
          grep -v "assertion fail" compile.log | grep -iE "$PAT" | head -8 | cut -c1-280 | while IFS= read -r L; do
            echo "::error::${L}"
          done

      - name: Diagnostik prototipe (hanya jalan kalau compile gagal)
        if: failure()
        run: |
          mkdir -p diag
          [ -f compile.log ] && cp compile.log diag/compile.log   # COMPILELOG_V1
          NOF_INCLUDE="$(pwd)/build_sketch/src"
          arduino-cli version > diag/versions.txt 2>&1 || true
          arduino-cli core list >> diag/versions.txt 2>&1 || true
          arduino-cli lib list >> diag/versions.txt 2>&1 || true
          DISP_FLAG=""
          [ "$VARIANT" = "st7796" ] && DISP_FLAG="-DRP_DISPLAY_ST7796"
          [ "$VARIANT" = "aether" ] && DISP_FLAG="-DRP_BOARD_AETHER"
          arduino-cli compile --fqbn esp32:esp32:esp32s3 \
            --board-options "FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" \
            --build-property "compiler.cpp.extra_flags=-DWSENSE_FORCE=1 ${DISP_FLAG} -I${NOF_INCLUDE}" \
            --build-property "compiler.c.extra_flags=-I${NOF_INCLUDE}" \
            --preprocess build_sketch > diag/preprocessed.cpp 2> diag/preprocess.err || true
          head -c 300000 diag/preprocessed.cpp > diag/preprocessed_head.cpp || true
          rm -f diag/preprocessed.cpp
          cp build_sketch/rp_types.h diag/ 2>/dev/null || true

      - name: Upload diagnostik
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostik-prototipe-${{ matrix.variant }}
          path: diag/

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-binaries-${{ matrix.variant }}
          path: build/*.bin

      - name: Siapkan firmware.bin untuk OTA
        if: github.event_name != 'pull_request'
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}   # OTA_SIG_V1: PEM kunci privat ECDSA P-256 (tools/ota_keygen.sh); kosong = info.txt tidak ditandatangani
        run: |
          test -f build/build_sketch.ino.bin || (echo "::error::build_sketch.ino.bin tidak ada" && ls build && exit 1)
          cp build/build_sketch.ino.bin firmware.bin
          test -f build/build_sketch.ino.merged.bin || (echo "::error::build_sketch.ino.merged.bin tidak ada" && ls build && exit 1)
          MERGED=ren_phone_s3_merged.bin
          [ "$VARIANT" = "st7796" ] && MERGED=ren_phone_s3_st7796_merged.bin
          [ "$VARIANT" = "aether" ] && MERGED=ren_phone_s3_aether_merged.bin
          cp build/build_sketch.ino.merged.bin "$MERGED"
          echo "MERGED=$MERGED" >> "$GITHUB_ENV"
          VER=dev; [ -f VERSION ] && VER="$(tr -d ' \r\n' < VERSION)"; [ -n "$VER" ] || VER=dev
          MD5="$(md5sum firmware.bin | cut -d' ' -f1)"
          SHA256="$(sha256sum firmware.bin | cut -d' ' -f1)"
          SIZE="$(stat -c%s firmware.bin)"
          {
            echo "branch=${RP_BRANCH}"
            echo "build=${{ github.run_number }}"
            echo "version=${VER}"
            echo "base=${RP_BASE_REV}"
            echo "size=${SIZE}"
            echo "md5=${MD5}"
            echo "sha256=${SHA256}"
            echo "sha=${{ github.sha }}"
            echo "display=${VARIANT}"
          } > info.txt
          # OTA_SIG_V1: tanda tangan ECDSA atas seluruh isi info.txt (baris "sig=" ditambahkan di akhir)
          if [ -n "${OTA_SIGNING_KEY:-}" ]; then
            bash tools/ota_sign.sh info.txt
          else
            echo "::warning::secret OTA_SIGNING_KEY belum diisi -> info.txt TIDAK ditandatangani (HP dgn kunci aktif akan menolak update ini)"
          fi
          cat info.txt
          # changelog Inggris untuk layar Update di HP: ambil bagian versi ini dari CHANGELOG.md
          # (kalau tidak ada bagian utk versi ini -> bagian pertama). ASCII saja, maks ~1400 byte.
          rm -f changelog.txt
          if [ -f CHANGELOG.md ]; then
            # ambil isi bagian "## ...<VER>..."; kalau tak ada bagian utk versi ini -> bagian "## " pertama
            sec() { awk -v pat="$1" 'BEGIN{on=0} /^## /{ if(on) exit; if(pat=="" || index($0, pat)) on=1; next } on{print}' CHANGELOG.md; }
            sec "$VER" > cl_sec.txt
            [ -s cl_sec.txt ] || sec "" > cl_sec.txt
            { sed -e 's/\*\*//g' -e 's/`//g' -e 's/^[*+] /- /' -e 's/^### *//' cl_sec.txt \
                | LC_ALL=C tr -cd '\11\12\40-\176' | sed -e 's/[[:space:]]*$//' | cat -s \
                | head -c 1400 > changelog.txt; } || true
            sed -i -e '/./,$!d' changelog.txt 2>/dev/null || true     # buang baris kosong di awal
            rm -f cl_sec.txt
            [ -s changelog.txt ] || rm -f changelog.txt                # kosong -> tidak dipublikasikan
          fi
          if [ -s changelog.txt ]; then echo "--- changelog.txt ---"; cat changelog.txt; else echo "(tidak ada changelog)"; fi

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=dev; [ -f VERSION ] && VER="$(tr -d ' \r\n' < VERSION)"; [ -n "$VER" ] || VER=dev
          TAG="build-${{ github.run_number }}"
          TITLE="Firmware v${VER} (build ${{ github.run_number }})"
          # branch stabil = rilis biasa; branch lain = PRERELEASE (tidak dianggap "terbaru" oleh tombol versi lama)
          case "$RP_BRANCH" in main|master|remote-control) PRE="" ;; *) PRE="--prerelease" ;; esac
          FILES="firmware.bin $MERGED"
          if [ "$VARIANT" = "st7796" ]; then
            # Layar ST7796: tag & nama berkas SENDIRI, selalu prerelease -> tidak pernah jadi "releases/latest"
            # (jalur lama HP ILI9341) dan tidak menimpa berkas varian ILI9341.
            TAG="st7796-${{ github.run_number }}"
            TITLE="Firmware v${VER} layar ST7796 (build ${{ github.run_number }})"
            PRE="--prerelease"
            cp firmware.bin firmware-st7796.bin
            FILES="firmware-st7796.bin $MERGED"
          fi
          if [ "$VARIANT" = "aether" ]; then
            TAG="aether-${{ github.run_number }}"
            TITLE="Firmware v${VER} Aether Board (build ${{ github.run_number }})"
            PRE="--prerelease"
            cp firmware.bin firmware-aether.bin
            FILES="firmware-aether.bin $MERGED"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES $PRE \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --notes "Commit ${{ github.sha }} (${{ github.ref_name }})"
          fi

          # channel bergerak per-branch -- dibaca fitur "pilih branch" di app Update (selalu prerelease)
          CH="channel-${RP_BRANCH}"
          NOTES="Channel branch ${RP_BRANCH}: build ${{ github.run_number }}, commit ${{ github.sha }}"
          OTA_FILES="firmware.bin info.txt"
          [ -s changelog.txt ] && OTA_FILES="$OTA_FILES changelog.txt"
          if gh release view "$CH" >/dev/null 2>&1; then
          gh release delete-asset "$CH" firmware.bin -y 2>/dev/null || true
          gh release delete-asset "$CH" info.txt -y 2>/dev/null || true
          gh release delete-asset "$CH" changelog.txt -y 2>/dev/null || true   # buang changelog build lama (kalau build ini tak punya)
            gh release upload "$CH" $OTA_FILES --clobber
            gh release edit "$CH" --prerelease --notes "$NOTES"
          else
            gh release create "$CH" $OTA_FILES --prerelease \
              --target "${{ github.sha }}" \
              --title "Channel ${RP_BRANCH}" \
              --notes "$NOTES"
          fi

  flasher:
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      actions: read
      id-token: write
    uses: ./.github/workflows/flasher-pages.yml
