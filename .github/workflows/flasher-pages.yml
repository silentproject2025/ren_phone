name: Web Flasher (GitHub Pages)

# Dipanggil otomatis dari workflow build S3 & CAM setelah Release dibuat.
# Bisa juga dijalankan manual (Run workflow) untuk membangun ulang halamannya.
# Halaman membedakan firmware STABIL (dari main/master) dan UJI COBA (dari branch lain),
# dan menyediakan tombol Unduh .bin + SHA-256 + tautan repo GitHub & tombol Bagikan.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ambil firmware dari Release & buat halaman flasher
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, html, json, os, re, shutil, subprocess, datetime

          repo = os.environ["REPO"]
          site = "site"
          os.makedirs(site, exist_ok=True)

          def gh(*args):
              return subprocess.run(["gh", *args], capture_output=True, text=True, check=True).stdout

          DEVICES = [
              {"key": "s3", "prefix": "build-", "asset": "ren_phone_s3_merged.bin", "chip": "ESP32-S3", "esp": "esp32s3",
               "title": "Ren Phone", "sub": "ESP32-S3 &middot; HP utama", "short": "Ren Phone"},
              {"key": "cam", "prefix": "cam-", "asset": "cam_merged.bin", "chip": "ESP32", "esp": "esp32",
               "title": "Co-prosesor Bluetooth", "sub": "ESP32-CAM &middot; board kamera", "short": "Co-prosesor BT"},
          ]
          BULAN = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"]

          def tgl(iso):
              try:
                  y, m, d = iso[:10].split("-")
                  return "%d %s %s" % (int(d), BULAN[int(m) - 1], y)
              except Exception:
                  return iso[:10]

          def sha256_of(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          def fill(tpl, **kw):
              for k, v in kw.items():
                  tpl = tpl.replace("@@" + k + "@@", str(v))
              return tpl

          rels = json.loads(gh("release", "list", "--repo", repo, "--limit", "80", "--json", "tagName,publishedAt"))
          esc = html.escape

          BUILD_TPL = """
          <article class="build" data-chan="@@chan@@">
            <div class="build-top">
              <span class="tag @@cls@@"><i></i>@@label@@</span>
              <span class="from">branch <b>@@branch@@</b></span>
            </div>
            <p class="note">@@note@@</p>
            <dl class="spec">
              <div><dt>rilis</dt><dd>@@tag@@</dd></div>
              <div><dt>tanggal</dt><dd>@@date@@</dd></div>
              <div><dt>ukuran</dt><dd>@@size@@ MB</dd></div>
              <div><dt>commit</dt><dd>@@commit@@</dd></div>
            </dl>
            <button type="button" class="hash" data-copy="@@sha@@" title="Klik untuk menyalin SHA-256">
              <span>sha256</span><code>@@sha_short@@&hellip;</code><em>salin</em>
            </button>
            <div class="actions">
              <esp-web-install-button manifest="@@manifest@@">
                <button slot="activate" class="btn primary">Pasang via USB</button>
                <span slot="unsupported" class="mut">Browser ini belum mendukung Web Serial. Pakai tombol Unduh di samping.</span>
                <span slot="not-allowed" class="mut">Halaman harus dibuka lewat https.</span>
              </esp-web-install-button>
              <a class="btn" href="@@binf@@" download="@@dlname@@">Unduh .bin <small>@@size@@ MB</small></a>
            </div>
            <details class="manual">
              <summary>Flash manual pakai esptool</summary>
              <p>File ini sudah <b>merged</b> (bootloader + partisi + aplikasi), jadi ditulis di alamat <code>0x0</code>.</p>
              <div class="cmd"><code>esptool.py --chip @@esp@@ --baud 921600 write_flash 0x0 @@dlname@@</code>
                <button type="button" data-copy="esptool.py --chip @@esp@@ --baud 921600 write_flash 0x0 @@dlname@@">salin</button></div>
            </details>
            <a class="notes" href="@@url@@">Catatan rilis &rarr;</a>
          </article>
          """

          panels = []
          tabs = []
          for dev in DEVICES:
              found = {}
              checked = 0
              for r in rels:
                  tag = r["tagName"]
                  if not tag.startswith(dev["prefix"]):
                      continue
                  if len(found) == 2 or checked >= 30:
                      break
                  checked += 1
                  try:
                      info = json.loads(gh("release", "view", tag, "--repo", repo, "--json", "body,url,assets"))
                  except Exception:
                      continue
                  asset = next((a for a in info.get("assets", []) if a["name"] == dev["asset"]), None)
                  if not asset:
                      continue
                  m = re.search(r"Commit ([0-9a-f]{7,40}) \(([^)]*)\)", info.get("body") or "")
                  sha, branch = (m.group(1), m.group(2)) if m else ("", "?")
                  chan = "stable" if branch in ("main", "master") else "test"
                  if chan in found:
                      continue
                  tmp = os.path.join("dl", dev["key"] + "-" + chan)
                  os.makedirs(tmp, exist_ok=True)
                  try:
                      gh("release", "download", tag, "--repo", repo, "--pattern", dev["asset"], "--dir", tmp)
                  except Exception:
                      continue
                  binf = "%s-%s.bin" % (dev["key"], chan)
                  shutil.move(os.path.join(tmp, dev["asset"]), os.path.join(site, binf))
                  mf = "%s-%s.json" % (dev["key"], chan)
                  json.dump({"name": dev["title"], "version": "%s (%s)" % (tag, branch),
                             "new_install_prompt_erase": True,
                             "builds": [{"chipFamily": dev["chip"], "parts": [{"path": binf, "offset": 0}]}]},
                            open(os.path.join(site, mf), "w"), indent=2)
                  dlname = re.sub(r"[^A-Za-z0-9._-]+", "-", "ren_phone_%s_%s_%s.bin" % (dev["key"], tag, branch)).strip("-")
                  found[chan] = {"tag": tag, "branch": branch, "sha": sha, "url": info.get("url", ""),
                                 "size": asset.get("size", 0), "date": tgl(r.get("publishedAt", "")),
                                 "manifest": mf, "binf": binf, "dlname": dlname,
                                 "hash": sha256_of(os.path.join(site, binf))}

              def build(chan, d):
                  if chan == "stable":
                      label, cls = "STABIL", "ok"
                      note = "Sudah digabung ke <b>%s</b>. Pilihan aman untuk dipakai sehari-hari." % esc(d["branch"])
                  else:
                      label, cls = "UJI COBA", "warn"
                      note = "Dibuat dari branch <b>%s</b>. Fitur baru, bisa saja belum stabil." % esc(d["branch"])
                  commit = "&ndash;"
                  if d["sha"]:
                      commit = '<a href="https://github.com/%s/commit/%s">%s</a>' % (esc(repo), esc(d["sha"]), esc(d["sha"][:7]))
                  return fill(BUILD_TPL, chan=chan, cls=cls, label=label, branch=esc(d["branch"]), note=note,
                              tag=esc(d["tag"]), date=esc(d["date"]), size="%.2f" % (d["size"] / 1048576.0),
                              commit=commit, sha=d["hash"], sha_short=d["hash"][:16], manifest=esc(d["manifest"]),
                              binf=esc(d["binf"]), dlname=esc(d["dlname"]), esp=dev["esp"], url=esc(d["url"]))

              builds = "".join(build(c, found[c]) for c in ("stable", "test") if c in found)
              if not builds:
                  builds = '<p class="empty">Belum ada firmware untuk perangkat ini.</p>'
              seg = ""
              if len(found) == 2:
                  seg = ('<div class="seg" role="group" aria-label="Pilih kanal">'
                         '<button type="button" data-chan="stable">Stabil</button>'
                         '<button type="button" data-chan="test">Uji coba</button></div>')
              default = "stable" if "stable" in found else "test"
              panels.append('<section class="panel" id="p-%s" data-default="%s"><header class="panel-head">'
                            '<div><h2>%s</h2><p>%s</p></div>%s</header>%s</section>' % (
                                dev["key"], default, esc(dev["title"]), dev["sub"], seg, builds))
              tabs.append('<button type="button" role="tab" data-tab="p-%s">%s</button>' % (dev["key"], esc(dev["short"])))

          GH_ICON = ('<svg class="ghi" viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" fill="currentColor">'
                     '<path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>')
          SHARE_ICON = ('<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
                        '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>'
                        '<line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>')
          _owner, _name = (repo.split("/", 1) + [""])[:2]
          PAGES_URL = "https://%s.github.io/%s/" % (_owner.lower(), _name)

          CSS = """
          :root{color-scheme:dark light;--bg:#12120f;--panel:#1a1a16;--ink:#ece8dc;--mut:#8d8a7d;--line:#2e2d26;--acc:#ff6b2c;--acc-ink:#14120e;--ok:#8fbf6a;--warn:#e8b23a}
          @media (prefers-color-scheme:light){:root{--bg:#efece3;--panel:#f8f6f0;--ink:#1b1a14;--mut:#6e6b5f;--line:#d8d4c7;--acc:#d9480f;--acc-ink:#fff8f0;--ok:#3f7d2a;--warn:#a66a00}}
          *{box-sizing:border-box}[hidden]{display:none!important}
          html{scroll-behavior:smooth}
          body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
          a{color:inherit}code,.mono,dt,.tag,.eyebrow,.hash,.seg button,[role=tab]{font-family:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace}
          .wrap{max-width:980px;margin:0 auto;padding:0 20px}
          .hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;padding:44px 0 40px;border-bottom:1px solid var(--line)}
          .eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:0 0 14px}
          h1{font-size:clamp(2rem,6vw,3.3rem);line-height:1.04;margin:0 0 16px;letter-spacing:-.035em;font-weight:700}
          h1 u{text-decoration:none;box-shadow:inset 0 -.32em 0 color-mix(in srgb,var(--acc) 38%,transparent)}
          .lead{margin:0;max-width:46ch;color:var(--mut);font-size:1.02rem}
          .facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin:22px 0 0;padding:0;list-style:none;font-size:.82rem;color:var(--mut)}
          .facts li:before{content:"/ ";color:var(--acc)}
          .phone{appearance:none;border:0;background:none;padding:0;cursor:pointer;perspective:700px;font:inherit;color:inherit}
          .phone-body{position:relative;width:148px;height:296px;border:2px solid var(--ink);border-radius:26px;background:#0a0a09;overflow:hidden;transition:transform .25s ease;transform:rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg));box-shadow:8px 8px 0 color-mix(in srgb,var(--ink) 14%,transparent)}
          .phone:focus-visible{outline:2px solid var(--acc);outline-offset:6px;border-radius:30px}
          .home{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;align-content:center;padding:22px 16px}
          .home span{aspect-ratio:1;border-radius:9px;background:#2a2a24}.home span:nth-child(3n+1){background:var(--acc)}.home span:nth-child(5n){background:#3d6a5c}
          .lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:44px;color:#ece8dc;background:linear-gradient(#1c1b17,#0a0a09);transition:transform .55s cubic-bezier(.7,0,.2,1)}
          .phone.open .lock{transform:translateY(-102%)}
          .lock .d{font-size:.62rem;opacity:.7;letter-spacing:.04em}
          .lock .t{font:700 2.5rem/1.1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:-.04em;margin-top:4px}
          .lock .ip{margin-top:10px;font:.62rem ui-monospace,Menlo,Consolas,monospace;padding:4px 9px;border:1px solid #4a4940;border-radius:99px;background:#ffffff12;min-height:22px}
          .lock .ip b{color:var(--acc);font-weight:600}.lock .ip i{display:inline-block;width:1px;height:.8em;background:#ece8dc;margin-left:1px;vertical-align:-1px;animation:bl 1s steps(1) infinite}
          .lock .sw{position:absolute;bottom:14px;font-size:.55rem;opacity:.55}
          @keyframes bl{50%{opacity:0}}
          .topbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.8rem;color:var(--mut);font-family:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
          .topbar>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .tools{display:flex;gap:2px;flex:none}
          .icon{display:inline-grid;place-items:center;width:36px;height:36px;border:0;border-radius:50%;background:none;color:var(--mut);cursor:pointer;text-decoration:none;transition:color .2s,background-color .2s,transform .2s}
          .icon:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 10%,transparent)}.icon:active{transform:scale(.9)}
          .icon svg{display:block}.ghi{flex:none}
          footer a.gh-f{display:inline-flex;gap:7px;align-items:center}
          .hint{display:block;margin-top:12px;text-align:center;font-size:.72rem;color:var(--mut)}
          .tabs{display:flex;gap:0;margin:34px 0 0;border-bottom:1px solid var(--line)}
          [role=tab]{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:10px 18px 12px;font-size:.85rem;cursor:pointer;margin-bottom:-1px}
          [role=tab]:hover{color:var(--ink)}[role=tab][aria-selected=true]{color:var(--ink);border-bottom-color:var(--acc)}
          .note-serial{margin:18px 0 0;padding:10px 14px;border:1px solid var(--warn);color:var(--warn);font-size:.86rem}
          .panel{padding:26px 0 8px}
          .panel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
          .panel-head h2{margin:0;font-size:1.4rem;letter-spacing:-.02em}.panel-head p{margin:2px 0 0;color:var(--mut);font-size:.88rem}
          .seg{display:inline-flex;border:1px solid var(--line)}
          .seg button{appearance:none;border:0;background:none;color:var(--mut);padding:6px 14px;font-size:.78rem;cursor:pointer}
          .seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
          .panel>.build+.build{margin-top:16px}
          .build{background:var(--panel);border:1px solid var(--line);padding:22px;display:grid;gap:14px}
          .build-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
          .tag{display:inline-flex;align-items:center;gap:8px;font-size:.74rem;font-weight:700;letter-spacing:.1em}
          .tag i{width:8px;height:8px;border-radius:50%;background:currentColor}.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}
          .from{font-size:.8rem;color:var(--mut)}.from b{color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:500}
          .note{margin:0;color:var(--mut)}.note b{color:var(--ink);font-weight:600}
          .spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0;margin:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
          .spec div{padding:10px 12px 10px 0}.spec dt{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
          .spec dd{margin:2px 0 0;font:500 .9rem ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}.spec dd a{color:var(--acc);text-decoration:none}
          .hash{display:flex;align-items:center;gap:12px;width:100%;appearance:none;background:none;border:1px dashed var(--line);color:var(--ink);padding:8px 12px;cursor:pointer;font-size:.8rem;text-align:left}
          .hash span{color:var(--mut)}.hash code{flex:1;color:var(--ink)}.hash em{font-style:normal;color:var(--acc)}.hash:hover{border-color:var(--acc)}
          .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
          .actions esp-web-install-button{display:contents}
          .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 .92rem system-ui,sans-serif;text-decoration:none;color:var(--ink);background:none;border:1px solid var(--ink);padding:11px 18px;cursor:pointer;transition:transform .12s,box-shadow .12s}
          .btn small{font:.72rem ui-monospace,Menlo,Consolas,monospace;opacity:.65}
          .btn:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink)}.btn:active{transform:none;box-shadow:none}
          .btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}.btn.primary:hover{box-shadow:3px 3px 0 var(--ink)}
          .mut{color:var(--mut);font-size:.85rem;align-self:center}
          .manual summary,.faq summary{cursor:pointer;font-size:.86rem;color:var(--mut)}.manual summary:hover,.faq summary:hover{color:var(--ink)}
          .manual p{margin:8px 0;color:var(--mut);font-size:.88rem}
          .cmd{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--line);padding:10px 12px;overflow-x:auto}
          .cmd code{font-size:.8rem;white-space:nowrap}.cmd button{appearance:none;border:0;background:none;color:var(--acc);cursor:pointer;font:inherit;font-size:.8rem}
          .notes{font-size:.82rem;color:var(--mut);text-decoration:none}.notes:hover{color:var(--ink)}
          .empty{color:var(--mut);padding:26px;border:1px dashed var(--line);text-align:center}
          .how{margin:44px 0 0;padding:34px 0 0;border-top:1px solid var(--line);display:grid;grid-template-columns:200px 1fr;gap:26px}
          .how h2{margin:0;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:500}
          .how ol{margin:0;padding:0;list-style:none;counter-reset:step}.how li{counter-increment:step;display:grid;grid-template-columns:34px 1fr;padding:6px 0}
          .how li:before{content:"0" counter(step);font:.8rem ui-monospace,Menlo,Consolas,monospace;color:var(--acc);padding-top:2px}
          .faq{margin-top:12px;display:grid;gap:8px}.faq p{margin:6px 0 4px;color:var(--mut);font-size:.9rem}
          footer{margin-top:50px;padding:20px 0 40px;border-top:1px solid var(--line);color:var(--mut);font-size:.8rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
          footer a{text-decoration:none;border-bottom:1px solid var(--line)}
          .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:8px 16px;font:.82rem ui-monospace,Menlo,Consolas,monospace;transition:.25s;pointer-events:none}
          .toast.on{opacity:1;transform:translate(-50%,0)}

          :root{interpolate-size:allow-keywords}
          @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
          .enter{animation:up .42s cubic-bezier(.2,.7,.2,1) both}
          .hero>div:first-child>*{animation:up .65s cubic-bezier(.2,.7,.2,1) both}
          .hero>div:first-child>*:nth-child(1){animation-delay:.05s}.hero>div:first-child>*:nth-child(2){animation-delay:.12s}
          .hero>div:first-child>*:nth-child(3){animation-delay:.2s}.hero>div:first-child>*:nth-child(4){animation-delay:.28s}
          .hero>div:last-child{animation:up .8s cubic-bezier(.2,.7,.2,1) .25s both}
          .tabs{position:relative}
          .ind{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--acc);transition:transform .38s cubic-bezier(.65,0,.25,1),width .38s cubic-bezier(.65,0,.25,1)}
          .js [role=tab][aria-selected=true]{border-bottom-color:transparent}
          [role=tab]{transition:color .25s}
          .seg button{transition:background-color .25s,color .25s}
          .hash{transition:border-color .25s}.notes{transition:color .25s}
          .home span{transform:scale(.8);opacity:.5;transition:transform .55s cubic-bezier(.2,.7,.2,1),opacity .45s}
          .phone.open .home span{transform:none;opacity:1}
          .phone.open .home span:nth-child(2){transition-delay:.06s}.phone.open .home span:nth-child(3){transition-delay:.12s}
          .phone.open .home span:nth-child(4){transition-delay:.1s}.phone.open .home span:nth-child(5){transition-delay:.16s}
          .phone.open .home span:nth-child(6){transition-delay:.22s}.phone.open .home span:nth-child(7){transition-delay:.2s}
          .phone.open .home span:nth-child(8){transition-delay:.26s}.phone.open .home span:nth-child(9){transition-delay:.32s}
          details::details-content{block-size:0;overflow:clip;transition:block-size .3s ease,content-visibility .3s allow-discrete}
          details[open]::details-content{block-size:auto}
          .js .rv{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
          .js .rv.in{opacity:1;transform:none}
          @media (max-width:760px){.hero{grid-template-columns:1fr;padding-top:40px}.phone{justify-self:start}.how{grid-template-columns:1fr}.btn{flex:1 1 100%}}
          @media (max-width:760px){.hero>div:last-child{justify-self:start}}
          @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
          """

          JS = """
          (function(){
            var $=function(s,c){return [].slice.call((c||document).querySelectorAll(s));};
            document.documentElement.classList.add('js');
            var panels=$('.panel'), tabs=$('[role=tab]');
            var ind=document.getElementById('ind');
            function anim(el){el.classList.remove('enter');void el.offsetWidth;el.classList.add('enter');}
            function moveInd(first){
              var t=tabs.filter(function(x){return x.getAttribute('aria-selected')==='true';})[0];
              if(!t||!ind) return;
              if(first===true){ind.style.transition='none';}
              ind.style.width=t.offsetWidth+'px';ind.style.transform='translateX('+t.offsetLeft+'px)';
              if(first===true){void ind.offsetWidth;ind.style.transition='';}
            }
            function showPanel(id,first){
              panels.forEach(function(p){var h=(p.id!==id);var was=p.hidden;p.hidden=h;if(!h&&was&&first!==true)anim(p);});
              tabs.forEach(function(t){t.setAttribute('aria-selected',String(t.getAttribute('data-tab')===id));});
              moveInd(first);
              if(history.replaceState) history.replaceState(null,'','#'+id.slice(2));
            }
            window.addEventListener('resize',function(){moveInd(true);});
            if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){moveInd(true);});
            tabs.forEach(function(t){t.addEventListener('click',function(){showPanel(t.getAttribute('data-tab'));});});
            var want='p-'+(location.hash||'').slice(1);
            showPanel(document.getElementById(want)?want:(panels[0]||{}).id,true);
            panels.forEach(function(p){
              var btns=$('.seg button',p), builds=$('.build',p);
              function pick(c){
                builds.forEach(function(b){var h=(b.getAttribute('data-chan')!==c);var was=b.hidden;b.hidden=h;if(!h&&was)anim(b);});
                btns.forEach(function(x){x.setAttribute('aria-pressed',String(x.getAttribute('data-chan')===c));});
              }
              btns.forEach(function(x){x.addEventListener('click',function(){pick(x.getAttribute('data-chan'));});});
              if(btns.length) pick(p.getAttribute('data-default'));
            });
            var toast=document.getElementById('toast'), tt;
            function say(m){toast.textContent=m;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('on');},1600);}
            function copyText(v){
              function ok(){say('Tersalin');}
              if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v).then(ok,function(){say('Gagal menyalin');});}
              else{var a=document.createElement('textarea');a.value=v;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok();}catch(e){say('Gagal menyalin');}a.remove();}
            }
            $('[data-copy]').forEach(function(b){b.addEventListener('click',function(){copyText(b.getAttribute('data-copy'));});});
            var sh=document.getElementById('share');
            if(sh){sh.addEventListener('click',function(){
              var url=location.href.split('#')[0];
              if(navigator.share){navigator.share({title:document.title,text:'Ren Phone: firmware + web flasher',url:url}).catch(function(){});}
              else{copyText(url);}
            });}
            var rv=$('.rv');
            if('IntersectionObserver' in window){
              var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.12});
              rv.forEach(function(el){io.observe(el);});
            }else{rv.forEach(function(el){el.classList.add('in');});}
            if(!('serial' in navigator)){var n=document.getElementById('serial-note');if(n)n.hidden=false;}
            var ph=document.getElementById('phone');
            if(ph){
              var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
              var tEl=document.getElementById('lk-t'), dEl=document.getElementById('lk-d'), ipEl=document.getElementById('lk-ip');
              function tick(){
                var n=new Date(), h=('0'+n.getHours()).slice(-2), m=('0'+n.getMinutes()).slice(-2);
                tEl.textContent=h+':'+m;
                try{dEl.textContent=n.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short'});}catch(e){dEl.textContent='';}
              }
              tick(); setInterval(tick,5000);
              var ipText='192.168.1.'+(20+Math.floor(Math.random()*200)), i=0;
              function typeIp(){
                ipEl.innerHTML='IP <b>'+ipText.slice(0,i)+'</b>'+(i<ipText.length?'<i></i>':'');
                if(i<ipText.length){i++;setTimeout(typeIp,reduce?0:85);}
              }
              setTimeout(typeIp,reduce?0:700);
              ph.addEventListener('click',function(){ph.classList.toggle('open');});
              if(!reduce){
                var body=ph.firstElementChild;
                ph.addEventListener('pointermove',function(e){
                  var r=ph.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
                  body.style.setProperty('--ry',(x*16)+'deg');body.style.setProperty('--rx',(-y*12)+'deg');
                });
                ph.addEventListener('pointerleave',function(){body.style.setProperty('--ry','0deg');body.style.setProperty('--rx','0deg');});
              }
            }
          })();
          """

          now = datetime.datetime.now(datetime.timezone.utc).strftime("%d/%m/%Y %H:%M UTC")
          page = """<!doctype html><html lang="id"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="theme-color" content="#12120f">
          <title>Ren Phone Flasher</title>
          <meta name="description" content="Firmware Ren Phone (ESP32-S3): pasang lewat browser via USB, atau unduh file .bin-nya.">
          <meta property="og:type" content="website"><meta property="og:title" content="Ren Phone Flasher">
          <meta property="og:description" content="Pasang firmware Ren Phone langsung dari browser, atau unduh file .bin-nya. Open source di GitHub.">
          <meta property="og:url" content="@@pages@@"><meta name="twitter:card" content="summary">
          <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
          <style>@@css@@</style></head><body>
          <div class="wrap">
          <div class="topbar"><span>@@repotxt@@</span><div class="tools">
            <button type="button" class="icon" id="share" aria-label="Bagikan halaman ini" title="Bagikan">@@sh@@</button>
            <a class="icon" href="https://github.com/@@repo@@" target="_blank" rel="noopener" aria-label="Lihat repo di GitHub" title="GitHub">@@gh@@</a>
          </div></div>
          <div class="hero">
            <div>
              <p class="eyebrow">ren_phone / web flasher</p>
              <h1>Pasang firmware, <u>tanpa install <span style="white-space:nowrap">apa-apa</span></u>.</h1>
              <p class="lead">Colok kabel USB, pilih versi, klik pasang. Atau unduh file .bin-nya dan flash sendiri kalau lebih suka begitu.</p>
              <ul class="facts"><li>Chrome / Edge</li><li>kabel data</li><li>sekitar 2 menit</li></ul>
            </div>
            <div>
              <button type="button" class="phone" id="phone" aria-label="Simulasi layar kunci. Klik untuk membuka kunci.">
                <div class="phone-body">
                  <div class="home"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
                  <div class="lock"><div class="d" id="lk-d"></div><div class="t" id="lk-t">--:--</div><div class="ip" id="lk-ip">IP</div><div class="sw">geser ke atas</div></div>
                </div>
              </button>
              <span class="hint">klik layarnya</span>
            </div>
          </div>
          <nav class="tabs" role="tablist" aria-label="Perangkat">@@tabs@@<span class="ind" id="ind" aria-hidden="true"></span></nav>
          <p class="note-serial" id="serial-note" hidden>Browser ini belum mendukung Web Serial, jadi tombol pasang tidak aktif. Tombol <b>Unduh .bin</b> tetap bisa dipakai, atau buka halaman ini di Chrome/Edge di komputer.</p>
          <main>@@panels@@</main>
          <section class="how rv">
            <h2>Cara pakai</h2>
            <div>
              <ol>
                <li><span>Buka halaman ini di <b>Chrome atau Edge</b> di komputer.</span></li>
                <li><span>Colok perangkat dengan <b>kabel data</b> (bukan kabel charge doang).</span></li>
                <li><span>Klik <b>Pasang via USB</b>, pilih port, tunggu sampai selesai.</span></li>
              </ol>
              <div class="faq">
                <details><summary>Port tidak muncul?</summary><p>Untuk ESP32-S3, tahan tombol BOOT sambil mencolok kabel, lalu coba lagi. Untuk ESP32-CAM, pakai adaptor USB-TTL dan hubungkan IO0 ke GND saat flash, lalu lepas dan tekan reset setelah selesai.</p></details>
                <details><summary>Apa arti kotak &quot;Hapus dulu&quot;?</summary><p>Kalau dicentang, semua pengaturan dan data di perangkat ikut terhapus. Biarkan kosong kalau cuma mau update.</p></details>
                <details><summary>Kapan pakai Unduh .bin?</summary><p>Kalau browser tidak mendukung Web Serial, kalau mau flash lewat esptool atau Termux/PC lain, atau kalau mau menyimpan versi tertentu sebagai cadangan. Cocokkan SHA-256 untuk memastikan file tidak rusak.</p></details>
                <details><summary>Update harian lebih mudah?</summary><p>Ya. Di HP, buka app Update lalu ketuk Terbaru, tanpa kabel dan komputer.</p></details>
              </div>
            </div>
          </section>
          <footer class="rv"><span>Dibuat otomatis oleh GitHub Actions &middot; @@now@@</span><a class="gh-f" href="https://github.com/@@repo@@" target="_blank" rel="noopener">@@gh@@ @@repo@@</a></footer>
          </div>
          <div class="toast" id="toast" role="status"></div>
          <script>@@js@@</script>
          </body></html>
          """
          out = fill(page, css=CSS, js=JS, tabs="".join(tabs), panels="".join(panels), now=now, repo=esc(repo),
                     repotxt=esc(repo.replace("/", " / ")), gh=GH_ICON, sh=SHARE_ICON, pages=esc(PAGES_URL))
          open(os.path.join(site, "index.html"), "w", encoding="utf-8").write(out)
          print(sorted(os.listdir(site)))
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload halaman
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
