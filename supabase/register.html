<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ren_phone · daftar nama</title>
<style>
:root{--bg:#f1ede4;--ink:#1b1a17;--mute:#7a7366;--line:#d6cfc0;--acc:#d4410c;--ok:#2f7d4f;--idle:#b3ab99}
@media(prefers-color-scheme:dark){:root{--bg:#15140f;--ink:#ece6d8;--mute:#8d8676;--line:#2e2c23;--acc:#ff6a2b;--ok:#6bcf8f;--idle:#5d5848}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;padding:28px 20px 60px}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;justify-content:space-between;color:var(--mute);font-size:12px}
header b{color:var(--ink);letter-spacing:.1em}
.n{font:700 72px/1 Georgia,"Iowan Old Style",serif;margin:40px 0 4px}
.cap{color:var(--mute);font-size:13px;margin-bottom:34px}
input{width:100%;background:none;border:0;border-bottom:2px solid var(--ink);color:var(--ink);font:inherit;font-size:16px;padding:8px 0;outline:0}
input::placeholder{color:var(--mute)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
li:hover b{color:var(--acc)}
li b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li span{color:var(--mute);font-size:13px;white-space:nowrap}
i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--idle);margin-right:10px}
i.on{background:var(--ok)}
.msg{color:var(--mute);padding:24px 0;text-align:center}
button{background:none;border:1px solid var(--ink);color:var(--ink);font:inherit;font-size:13px;padding:6px 14px;margin-top:16px;cursor:pointer}
button:hover{background:var(--ink);color:var(--bg)}
#t{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 14px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
#t.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header><b>REN_PHONE</b><span id="st">memuat…</span></header>

  <div class="n" id="n">–</div>
  <div class="cap" id="cap"></div>

  <input id="q" placeholder="cari nama…" autocomplete="off" spellcheck="false">
  <ul id="list"></ul>
  <div id="more"></div>

</div>
<div id="t"></div>

<script>
(function(){
  // Kunci "publishable" memang publik. Samakan dengan firmware/phone/devreg_conf.h.
  var URL="https://ywhyfkxkihyxhrehoqya.supabase.co",KEY="sb_publishable_qB00w154m7mc4f6YmtPnRw_Y1ZZ-oWs";
  var $=function(i){return document.getElementById(i)};
  var S={rows:[],named:0,q:"",all:false,err:false};
  var LIMIT=30;

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function ago(ms){
    var s=Math.max(0,(Date.now()-ms)/1000);
    if(s<600)return "menyala";
    if(s<3600)return Math.floor(s/60)+" mnt lalu";
    if(s<86400)return Math.floor(s/3600)+" jam lalu";
    if(s<2592000)return Math.floor(s/86400)+" hari lalu";
    return Math.floor(s/2592000)+" bln lalu";
  }
  function toast(m){var e=$("t");e.textContent=m;e.className="on";clearTimeout(toast.h);toast.h=setTimeout(function(){e.className=""},1400)}

  function load(){
    var h={"Content-Type":"application/json",apikey:KEY};
    return fetch(URL+"/rest/v1/rpc/public_board",{method:"POST",headers:h,body:"{}"}).then(function(r){
      if(!r.ok)throw new Error("HTTP "+r.status);return r.json();
    }).then(function(j){
      S.rows=(j.rows||[]).map(function(r){return{u:String(r.username),t:+new Date(r.last_seen)}});
      S.named=+j.named||S.rows.length;S.err=false;
    }).catch(function(){S.err=true}).then(draw);
  }

  function draw(){
    var live=S.rows.filter(function(r){return Date.now()-r.t<6e5}).length;
    $("n").textContent=S.err&&!S.rows.length?"–":S.named;
    $("cap").textContent=S.err&&!S.rows.length?"":"nama terdaftar · "+live+" menyala sekarang";
    $("st").textContent=S.err?"terputus":"tersambung";
    var q=S.q.toLowerCase();
    var list=S.rows.filter(function(r){return !q||r.u.toLowerCase().indexOf(q)>=0}).sort(function(a,b){return b.t-a.t});
    var show=S.all||q?list:list.slice(0,LIMIT);
    $("list").innerHTML=show.map(function(r){
      return '<li data-u="'+esc(r.u)+'"><b><i class="'+(Date.now()-r.t<6e5?"on":"")+'"></i>'+esc(r.u)+'</b><span>'+ago(r.t)+'</span></li>';
    }).join("");
    var m="";
    if(S.err)m='<div class="msg">Tidak bisa tersambung. <button id="retry">Coba lagi</button></div>';
    else if(!list.length)m='<div class="msg">'+(q?"Tidak ada yang cocok.":"Belum ada nama terdaftar.")+'</div>';
    else if(!S.all&&!q&&list.length>LIMIT)m='<button id="all">tampilkan semua ('+list.length+')</button>';
    $("more").innerHTML=m;
  }

  $("list").addEventListener("click",function(e){
    var li=e.target.closest("li");if(!li)return;
    var u=li.dataset.u;
    (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){toast(u+" disalin")},function(){toast("gagal menyalin")});
  });
  $("more").addEventListener("click",function(e){
    if(e.target.id==="all"){S.all=true;draw()}
    if(e.target.id==="retry")load();
  });
  $("q").addEventListener("input",function(e){S.q=e.target.value.trim();draw()});
  load();
  setInterval(function(){if(!document.hidden)load()},60000);
})();
</script>
</body>
</html>
